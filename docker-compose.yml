services:
    api:
        build: .
        container_name: blog_api
        ports:
            - "5000:5000"
        depends_on:
            - mongo_db
            - redis
        env_file:
            - .env.local
        environment:
            - MONGO_URI=mongodb://mongo_db:27017
            - REDIS_URL=redis://redis:6379
        command: >
            sh -c "node src/utils/seed-admin.js && node src/server.js"
        networks:
            - backend
        volumes:
            - ./src:/app/src

    mongo_db:
        image: mongo:6
        container_name: blog_db
        ports:
            - "27017:27017"
        volumes:
            - mongo_db:/data/db
        networks:
            - backend

    redis:
        image: redis:6
        container_name: blog_cache
        ports:
            - "6379:6379"
        networks:
            - backend

volumes:
    mongo_db:

networks:
    backend:
        driver: bridge