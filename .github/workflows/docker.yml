name: Docker

on:
  workflow_call:

jobs:
  build-prod:
    name: Build Prod Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build prod image
        run: docker build -f Dockerfile -t blog-api-prod .
