name: Lint

on:
  workflow_call:

jobs:
  biome-check:
    name: Biome Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Biome CI check
        run: npx biome ci ./src
