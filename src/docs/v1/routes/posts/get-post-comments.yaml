
summary: Get all comments for a specific post.
description: Retrieves a paginated list of comments associated with a given post ID.
tags: [Posts]
parameters:
  - name: postId
    in: path
    required: true
    schema:
      type: string
    description: The unique ID of the post to retrieve comments for.
    example: "60a6b9d4f1e9a21e4cfa1234"
  - name: page
    in: query
    required: false
    schema:
      type: integer
      default: 1
    description: Page number for pagination.
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      default: 10
    description: Number of comments per page.
responses:
  200:
    description: A paginated list of comments for the specified post.
    content:
      application/json:
        schema:
          type: object
          properties:
            postId:
              type: string
            comments:
              type: array
              items:
                $ref: '../../components/schemas/Comment.yaml'
            page:
              type: integer
            totalPages:
              type: integer
        example:
          postId: "60a6b9d4f1e9a21e4cfa1234"
          page: 1
          totalPages: 2
          comments:
            - _id: "64a5f10eaa1234567890abc1"
              content: "Great post!"
              user_id:
                _id: "609d6c9b3f1d2b001f89f100"
                username: "johndoe"
              createdAt: "2025-06-24T10:00:00.000Z"
              updatedAt: "2025-06-24T10:00:00Z"
  404:
    description: Post Not Found - The specified post ID does not exist.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorEnvelope.yaml'
        example:
          message: "Post not found."
  500:
    description: Internal Server Error.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorEnvelope.yaml'
