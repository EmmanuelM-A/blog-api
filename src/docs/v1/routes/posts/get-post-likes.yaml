# Get all likes for a post

summary: Get all likes for a specific post.
description: Retrieves a paginated list of like records and totals for a given post ID.
tags: [Posts]
parameters:
  - name: postId
    in: path
    required: true
    schema:
      type: string
    description: The unique ID of the post to retrieve likes for.
    example: "60a6b9d4f1e9a21e4cfa1234"
  - name: page
    in: query
    required: false
    schema:
      type: integer
      default: 1
    description: Page number for pagination.
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      default: 20
    description: Number of likes per page.
responses:
  200:
    description: A paginated list of likes for the specified post.
    content:
      application/json:
        schema:
          type: object
          properties:
            postId:
              type: string
            likesCount:
              type: integer
            page:
              type: integer
            totalPages:
              type: integer
            likes:
              type: array
              items:
                $ref: '../../components/schemas/Like.yaml'
        example:
          postId: "60a6b9d4f1e9a21e4cfa1234"
          likesCount: 3
          page: 1
          totalPages: 1
          likes:
            - _id: "60a6b9d4f1e9a21e4cfa1235"
              post_id: "60a6b9d4f1e9a21e4cfa1234"
              user_id: "609d6c9b3f1d2b001f89f100"
              createdAt: "2024-06-25T10:25:00Z"
            - _id: "60a6b9d4f1e9a21e4cfa1236"
              post_id: "60a6b9d4f1e9a21e4cfa1234"
              user_id: "609d6c9b3f1d2b001f89f101"
              createdAt: "2024-06-25T10:26:00Z"
  404:
    description: Post Not Found - The specified post ID does not exist.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorEnvelope.yaml'
        example:
          message: "Post not found."
  500:
    description: Internal Server Error.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorEnvelope.yaml'
